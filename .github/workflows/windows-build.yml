name: Windows desktop build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Qt app and installer (x64)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build Release
        shell: pwsh
        run: |
          & cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-output.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $diagnostics = Select-String -Path build-output.log -Pattern 'error C\\d+|fatal error C\\d+|error LNK\\d+|fatal error LNK\\d+' | Select-Object -First 20
            if (-not $diagnostics) { $diagnostics = Get-Content build-output.log -Tail 20 }
            foreach ($item in $diagnostics) {
              $message = if ($item -is [Microsoft.PowerShell.Commands.MatchInfo]) { $item.Line } else { [string]$item }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows build diagnostic::$message"
            }
          }
          exit $buildExit

      - name: Assemble portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package, artifacts | Out-Null
          Copy-Item build/Release/OpenSrc.exe package/OpenSrc.exe
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --dir package package/OpenSrc.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          Copy-Item LICENSE package/LICENSE
          Copy-Item README.md package/README.md
          Copy-Item THIRD-PARTY-NOTICES.md package/THIRD-PARTY-NOTICES.md
          New-Item -ItemType Directory -Force -Path package/docs, package/licenses/Qt | Out-Null
          Copy-Item docs/architecture.md package/docs/architecture.md
          Copy-Item licenses/LGPL-3.0.txt package/licenses/LGPL-3.0.txt
          if (Test-Path "$env:QT_ROOT_DIR/licenses") {
            Copy-Item "$env:QT_ROOT_DIR/licenses/*" package/licenses/Qt -Recurse
          }
          Compress-Archive -Path package/* -DestinationPath artifacts/OpenSrc-Portable-x64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeText = Get-Content CMakeLists.txt -Raw
          if ($cmakeText -notmatch 'project\(OpenSrc VERSION ([0-9.]+)') { throw 'Could not read the project version from CMakeLists.txt' }
          $version = $Matches[1]
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DAppVersion=$version" "/Oartifacts" "installer/OpenSrc.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenSrc-Windows-Portable-x64
          path: artifacts/OpenSrc-Portable-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenSrc-Windows-Installer-x64
          path: artifacts/OpenSrc-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: OpenSrc-Windows-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/OpenSrc-Portable-x64.zip
            release-assets/OpenSrc-Setup-*.exe
